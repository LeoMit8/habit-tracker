<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1 id="dateDisplay">Heute</h1>
            <div id="perfectDayBadge" class="hidden">⭐ PERFECT DAY ⭐</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-text">
                <span id="dailyGoalText">0 / 0 erledigt</span>
                <span id="dailyGoalPercent" class="accent-text">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="filters" class="tabs">
            <button class="tab-btn active" onclick="switchTab('today')">Heute</button>
            <button class="tab-btn" onclick="switchTab('week')">Woche</button>
            <button class="tab-btn" onclick="switchTab('progress')">Fortschritt</button>
        </div>
    </header>

    <main id="appContent">
        </main>

    <button id="addBtn" onclick="openModal()">
        <i class="fas fa-plus"></i>
    </button>

    <div id="addModal" class="modal hidden">
        <div class="modal-content">
            <h2>Neue Gewohnheit</h2>
            <input type="text" id="habitName" placeholder="Z.B. Lesen, Gym, Wasser trinken..." autocomplete="off">
            <label>Wie oft pro Woche?</label>
            <input type="number" id="habitFreq" value="7" min="1" max="7">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                <button class="btn-save" onclick="saveNewHabit()">Speichern</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
