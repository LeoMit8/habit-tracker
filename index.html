<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-top">
            <div class="date-navigation">
                <button class="icon-btn" onclick="changeMainDate(-1)"><i class="fas fa-chevron-left"></i></button>
                <h1 id="dateDisplay">Heute</h1>
                <button class="icon-btn" onclick="changeMainDate(1)" id="btnNextDay"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="perfectDayBadge" class="hidden">⭐ PERFECT DAY</div>
                <div class="bell-container" onclick="openMonthlyReview(false)">
                    <i class="fas fa-bell icon-btn" style="padding: 0;"></i>
                    <div id="notificationDot" class="notification-dot hidden"></div>
                </div>
                <button class="icon-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i></button>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-text">
                <span id="dailyGoalText">0 / 0 erledigt</span>
                <span id="dailyGoalPercent" class="accent-text">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="filters" class="tabs">
            <button class="tab-btn active" onclick="switchTab('today')">Heute</button>
            <button class="tab-btn" onclick="switchTab('week')">Woche</button>
            <button class="tab-btn" onclick="switchTab('progress')">Fortschritt</button>
        </div>
    </header>

    <main id="appContent">
        </main>

    <button id="addBtn" onclick="openModal()"><i class="fas fa-plus"></i></button>

    <div id="addModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Neue Gewohnheit</h2>
            <input type="hidden" id="editHabitId">
            <input type="text" id="habitName" placeholder="Z.B. Lesen, Gym, Miete..." autocomplete="off">
            <label>Wie oft?</label>
            <select id="habitType" onchange="toggleTargetInput()">
                <option value="daily">Täglich (Perfect Day)</option>
                <option value="weekly">Wöchentlich</option>
                <option value="monthly">Monatlich</option>
                <option value="yearly">Jährlich</option>
            </select>
            <div id="targetWrapper" class="hidden" style="margin-top: 15px;">
                <label>Wie oft in diesem Zeitraum?</label>
                <input type="number" id="habitTarget" value="3" min="1" max="365">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
                <button class="btn-save" onclick="saveNewHabit()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="diaryModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="diaryDateTitle">Datum</h2>
            <label>Status für diesen Tag:</label>
            <div class="status-selector">
                <button class="status-btn active" id="btnStatusNormal" onclick="tempDayStatus = 'normal'; updateStatusUI();">Normal</button>
                <button class="status-btn" id="btnStatusSick" onclick="tempDayStatus = 'sick'; updateStatusUI();">🤒 Krank</button>
                <button class="status-btn" id="btnStatusVacation" onclick="tempDayStatus = 'vacation'; updateStatusUI();">🏝️ Urlaub</button>
            </div>
            <div id="diaryCompletedList" style="margin-bottom: 15px; font-size: 14px; color: var(--accent);"></div>
            <label>Deine Notiz:</label>
            <textarea id="diaryNoteInput" rows="4" placeholder="Wie lief dein Tag?"></textarea>
            <input type="hidden" id="diaryDateHidden">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeDiaryModal()">Schließen</button>
                <button class="btn-save" onclick="saveDiaryNote()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h2>⚙️ Einstellungen</h2>
            
            <label style="margin-top: 10px; display: block;">App-Design (Theme):</label>
            <select id="themeSelect" onchange="changeTheme(this.value)" style="margin-bottom: 20px;">
                <option value="dark">Midnight Blue (Standard)</option>
                <option value="light">Clean Light (Weiß)</option>
                <option value="elite" id="eliteThemeOption" disabled>🔒 Elite Black & Gold (100 🔥 Streak benötigt)</option>
            </select>

            <label style="display: block;">Daten-Sicherheit:</label>
            <div class="modal-actions" style="flex-direction: column; gap: 10px; margin-bottom: 25px;">
                <button class="btn-save" style="width: 100%;" onclick="exportData()"><i class="fas fa-download"></i> Backup speichern</button>
                <button class="btn-cancel" style="width: 100%; position: relative;" onclick="document.getElementById('importFile').click()">
                    <i class="fas fa-upload"></i> Backup laden
                </button>
                <input type="file" id="importFile" accept="*/*" style="display: none;" onchange="importData(event)">
            </div>
            
            <label style="display: block;">Developer-Tools:</label>
            <button class="btn-cancel" style="width: 100%; border: 1px solid var(--accent); color: var(--accent);" onclick="openMonthlyReview(true)">👀 Monats-Rückblick testen</button>

            <div class="modal-actions" style="margin-top: 20px;">
                <button class="btn-cancel" onclick="closeSettingsModal()" style="width: 100%;">Schließen</button>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="modal hidden">
        <div class="modal-content" style="text-align: center; background: linear-gradient(135deg, var(--card-bg), var(--bg-color)); border: 1px solid var(--accent);">
            <h1 style="font-size: 28px; margin-bottom: 5px; color: var(--accent);">✨ Dein Rückblick</h1>
            <h2 id="reviewMonthTitle" style="color: var(--text-muted); margin-bottom: 25px;">Februar 2026</h2>
            
            <div style="font-size: 40px; margin-bottom: 10px;">🏆</div>
            <div id="reviewStats" style="text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 25px; line-height: 1.8;">
                </div>

            <div class="modal-actions">
                <button class="btn-save" style="width: 100%; font-size: 18px; padding: 15px;" onclick="closeMonthlyReview()">Neuen Monat dominieren 🚀</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

    <script src="app.js"></script>
</body>
</html>
